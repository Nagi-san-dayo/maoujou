<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>魔王城 ― 十の階層</title>
<style>
html,body{margin:0;height:100%;background:#05040a;color:#ece6d8;font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif}
#g{position:absolute;inset:0;margin:auto;width:min(100vw,calc(100vh*16/9));height:min(100vh,calc(100vw*9/16));container-type:inline-size;overflow:hidden;user-select:none}
canvas,#u{position:absolute;inset:0;width:100%;height:100%}
#u{display:flex;flex-direction:column;justify-content:flex-end;box-sizing:border-box;padding:3cqw;font-size:2.4cqw;line-height:1.8}
.tb{background:#0b0918ee;border:1px solid #d9b45a88;padding:1.2cqw 2.4cqw;min-height:9cqw;cursor:pointer}
.tb b{color:#d9b45a;font-size:2cqw}.tb p{margin:0}
.bn{margin:auto;font-size:8cqw;letter-spacing:.3em;color:#e8553d;cursor:pointer;text-align:center}
.bn small{font-size:2.6cqw;letter-spacing:.1em;color:#ece6d8;margin-top:2cqw;opacity:1}
.tw{margin:auto;text-align:center}.tw h1{font-size:8cqw;margin:0 0 1cqw;letter-spacing:.4em;font-weight:600}.tw h2{font-size:3cqw;margin:0 0 1cqw}
button{font:inherit;color:#ece6d8;background:#0b0918cc;border:1px solid #e8553d;padding:.5cqw 2cqw;cursor:pointer}
button:disabled{opacity:.35;cursor:default;border-color:#555}button:not(:disabled):hover{background:#e8553d55}
.gr{display:grid;gap:.4cqw;font-size:1.9cqw;width:40cqw;margin:auto}.gr button{padding:.2cqw 1cqw}
small{font-size:1.6cqw;opacity:.8;display:block;margin-top:1cqw}
button.wp{font-size:1.5cqw;opacity:.6;border-color:#555;margin-top:1.2cqw;padding:.2cqw 1cqw}
</style></head><body>
<div id="g"><canvas id="c" width="800" height="450"></canvas><div id="u"></div></div>
<script>
/* ===== BGM（bgm/フォルダに置く。ogg→m4a→mp3の順に試し、再生できた方を使う。片方だけでもOK。拡張子や形式はここで変更可）===== */
const bg=n=>[`bgm/${n}.ogg`,`bgm/${n}.m4a`,`bgm/${n}.mp3`];
const BGM={talk:bg('talk'),battle:bg('battle'),battle2:[...bg('battle2'),...bg('battle')],maou:bg('maou'),true:bg('true'),story:bg('story'),end:bg('end')}; // battle2=1〜4,6〜9階層用(ファイルが無ければbattleを代用)
/* ===== 基本設定 ===== */
const W=800,H=450,GY=400,CUT=60*60; // 戦闘時間は battle() の time(秒。省略時180=3分)。残り1分(CUT)で激化
const DE=['eins','zwei','drei','vier','fünf','sechs','sieben','acht','neun'];
const NM=[3,7,1,5,9,2,8,4,6]; // 階層(1〜9)→数字。階層と数字は一致しない
const resume=()=>{let a=A[cur];if(a&&a.paused)a.play().catch(()=>{})};
const c=document.getElementById('c'),x=c.getContext('2d'),U=document.getElementById('u');
const A={},K={},rnd=(a,b)=>a+Math.random()*(b-a);
let cur=null,mode='m',adv=null,bt=null,run={cl:[],min:{}},BH=250,seen=0,S={ng:0};
function save(){try{localStorage.setItem('save',JSON.stringify({ng:S.ng,cl:run.cl,min:run.min}))}catch(e){}} // 保存内容: 二周目フラグ, 撃破済み階層, 残り1分到達フラグ
try{let d=JSON.parse(localStorage.getItem('save')||'null');if(d){S.ng=d.ng|0;run.cl=Array.isArray(d.cl)?d.cl.filter(f=>f>=1&&f<=9):[];run.min=d.min||{}}else S.ng=+localStorage.getItem('ng')||0}catch(e){}
const ST=Array.from({length:50},(_,i)=>[((i*137)%W),((i*83)%H)]); // 背景星の固定配置
function play(k,st=0){if(cur===k){try{A[cur].currentTime=st}catch(e){}resume();return}if(cur&&A[cur])A[cur].pause();cur=k;if(!k)return;
 let a=A[k]||(A[k]=mk(k));try{a.currentTime=st}catch(e){}a.play().catch(()=>{})}
function mk(k){let L=BGM[k],i=0,a=new Audio(L[0]);a.loop=true;
 a.onerror=()=>{if(++i<L.length){a.src=L[i];if(cur===k)a.play().catch(()=>{})}};return a} // 読み込めない/非対応なら次の候補へ
/* ===== 弾幕パターン（ランダム要素排除・完全固定パターン化） ===== */
const B=(px,py,vx,vy,r=6)=>{let b={x:px,y:py,vx,vy,r,a:0};bt.bl.push(b);return b};
const ring=(px,py,n,v,o=0)=>{for(let i=0;i<n;i++){let a=o+i*6.283/n;B(px,py,Math.cos(a)*v,Math.sin(a)*v)}};
const aim=(px,py,v,o=0)=>{let a=Math.atan2(bt.y-12-py,bt.x-px)+o;B(px,py,Math.cos(a)*v,Math.sin(a)*v)};
const sweep=(T,n,v)=>{let l=T%(n*2)<n;B(l?-10:W+10,GY-8,l?v:-v,0,9)};
const P=[
 (e,T)=>{if(e(7))B((T*113)%(W-40)+20,-5,0,3.2+((T/7)%4)*0.3)},                                     // eins:規則的な雨
 (e,T)=>{if(e(75))sweep(T,75,4.5);if(e(40))B((T*173)%(W-40)+20,-5,0,3)},                           // zwei:地面弾＋周期的な落下弾
 (e,T)=>{if(e(6))for(let i=0;i<3;i++){let a=T*.11+i*2.094;B(400,110,Math.cos(a)*2.6,Math.sin(a)*2.6)}}, // drei:渦
 (e,T)=>{if(e(36)){let px=100+((T/36)%7)*100;for(let i=-1;i<=1;i++)aim(px,40,4,i*.22)}},           // vier:自機狙い（一定順序のX座標から発射）
 (e,T)=>{if(e(110))ring(400+Math.sin(T*0.03)*200,110+Math.cos(T*0.03)*40,12,2.2,T)},               // fünf:円運動する全方位リング
 (e,T)=>{if(e(110)){let g=((T/110|0)*5)%14;for(let i=0;i<17;i++)if(i<g||i>g+2)B(i*50,-5,0,2.4,8)}}, // sechs:隙間が一定規則で動く壁
 (e,T)=>{if(e(80)){let px=(T*127)%(W-40)+20;let b=B(px,-5,0,1.6,8);b.u=b=>{if(b.a++<110){let d=Math.atan2(bt.y-12-b.y,bt.x-b.x);b.vx+=(Math.cos(d)*1.8-b.vx)*.04;b.vy+=(Math.sin(d)*1.8-b.vy)*.04}}}}, // sieben:周期配置のホーミング
 (e,T)=>{if(e(45)){let px=100+((T/45|0)*130)%600;for(let i=-2;i<=2;i++){let a=1.5708+i*.3;B(px,40,Math.cos(a)*3,Math.sin(a)*3)}}}, // acht:扇状弾(周期位置から下向きに5発)
 (e,T)=>{P[4](e,T);if(e(70))sweep(T,70,5)}                                                          // neun:リング+地面弾(中ボス)
];
const SEG=360; // 弾幕ルーチンを切り替える間隔(フレーム。360=6秒)
const ROT=[[0,3,0,5],[1,6,1,2],[2,4,2,7],[3,0,3,6],[4,1,4,7],[5,2,5,3],[6,4,6,1],[7,0,7,5],[8,2,8,3]]; // 各敵の弾幕の順番(0=eins…8=neun)。先頭が得意技
const rot=n=>(e,T)=>P[ROT[n-1][T/SEG%4|0]](e,T);
/* 魔王・ミナ用:弾幕を「1種類=1つの部品」に分け、同時に出る種類数を固定する(魔王=2種類 / ミナ=3種類) */
const AT={rain:P[0],swp:(e,T)=>{if(e(75))sweep(T,75,4.5)},spiral:P[2],aim:P[3],ring:P[4],wall:P[5],home:P[6],fan:P[7]};
const MP=[['spiral','aim'],['wall','swp'],['home','ring'],['fan','aim']]; // 魔王:SEGごとに切り替え(各2種類)
const TP=[['spiral','aim','swp'],['ring','wall','rain'],['home','fan','swp'],['spiral','ring','aim'],['wall','home','rain'],['fan','aim','swp'],['ring','swp','wall']]; // ミナ(各3種類)
const MAOU=(e,T)=>MP[T/SEG%MP.length|0].forEach(k=>AT[k](e,T));
const TRUE=(e,T)=>TP[(T/SEG|0)%TP.length].forEach(k=>AT[k](e,T));
/* ===== 戦闘 ===== */
function battle(o){play(o.bgm,o.startT?o.startT/60:0);mode='b';adv=null;U.innerHTML='';bt={...o,t:o.startT||0,len:(o.time||180)*60,f:o.f||1,x:400,y:GY,vy:0,bl:[],cut:0,hard:0,dead:0}}
function step(){let s=bt;
 if(s.dead){if(--s.dead==0){let L=s.lose,rem=s.len-s.t,id=s.id;bt=null;die(L,rem,id)}return} // 死亡時の残り時間とIDをdieへ渡す
 if(s.cut>0)s.cut--; // カットイン表示中もゲームは止めない
 s.t++;
 if(s.t>=s.len-CUT&&!s.hard){s.hard=1;s.f*=1.6;s.cut=100} // 残り1分:激化+上部にカットイン(ゲームは止めない)
 let L=K.ArrowLeft||K.KeyA,R=K.ArrowRight||K.KeyD;
 s.x=Math.max(10,Math.min(W-10,s.x+(R?4.5:0)-(L?4.5:0)));
 let J=K.ArrowUp||K.KeyW;
 if(J&&s.y>=GY)s.vy=-12.5; // 最大ジャンプ(長押し)
 if(!J&&s.vy<-5)s.vy=-5; // 上昇中にボタンを離すと上昇が弱まる→押した時間で高さが変わる(-5を0に近づけるほど短押しが低くなる)
 s.vy+=.7;s.y+=s.vy;if(s.y>GY){s.y=GY;s.vy=0}
 if(s.t>60)s.pat(n=>s.t%Math.max(2,Math.round(n/s.f))==0,s.t);
 for(const b of s.bl){b.x+=b.vx;b.y+=b.vy;b.u&&b.u(b)}
 s.bl=s.bl.filter(b=>b.x>-60&&b.x<W+60&&b.y>-60&&b.y<H+40);
 if(s.bl.some(b=>Math.hypot(b.x-s.x,b.y-s.y+12)<b.r+3))s.dead=45; // 1発で死亡
 else if(s.t>=s.len){let d=s.done;bt=null;d()}
}
function drawB(){let s=bt,h=s.hue;
 x.fillStyle='#ffffff18';x.fillRect(0,GY,W,H-GY);x.fillStyle=`hsl(${h},50%,40%)`;x.fillRect(0,GY,W,2);
 x.textAlign='center';x.fillStyle=`hsla(${h},60%,70%,.25)`;x.font='bold 120px serif';x.fillText(s.name,W/2,230);
 x.fillStyle=`hsl(${h},70%,60%)`;x.beginPath();x.arc(W/2,60+Math.sin(s.t/20)*6,22,0,7);x.fill();
 for(const b of s.bl){x.fillStyle=`hsl(${(h+180)%360},90%,55%)`;x.beginPath();x.arc(b.x,b.y,b.r,0,7);x.fill();x.fillStyle='#fff';x.beginPath();x.arc(b.x,b.y,b.r*.5,0,7);x.fill()}
 x.fillStyle='#d9b45a';x.fillRect(s.x-7,s.y-24,14,24); // 勇者
 x.fillStyle='#fff';x.beginPath();x.arc(s.x,s.y-12,3,0,7);x.fill(); // 当たり判定
 x.font='20px serif';x.textAlign='left';x.fillStyle='#ece6d8';
 let r=Math.ceil((s.len-s.t)/60);x.fillText(`${s.name}　残り ${Math.floor(r/60)}:${String(r%60).padStart(2,'0')}`,16,28);
 if(s.cut>0){let t=s.cut,k=Math.min(1,(100-t)/12,t/12);x.save();x.translate((1-k)*-W,0);
  x.globalAlpha=.85;x.fillStyle=`hsl(${h},70%,30%)`;x.fillRect(0,36,W,60);x.globalAlpha=1;x.fillStyle='#fff';x.textAlign='center';
  x.font='bold 32px serif';x.fillText('残り1分',W/2,70);x.font='16px serif';x.fillText(s.name+'　— 踊り狂え—',W/2,89);x.restore()}
}
function draw(ts){x.fillStyle=`hsl(${BH},45%,7%)`;x.fillRect(0,0,W,H);
 for(let i=0;i<50;i++){x.fillStyle=`hsla(${BH},60%,85%,${.3+.3*Math.sin(ts/600+i)})`;x.fillRect(ST[i][0],ST[i][1],2,2)}
 if(bt)drawB()}
let acc=0,last=0;
function loop(ts){acc+=Math.min(ts-last,100);last=ts;while(acc>=16.67){acc-=16.67;if(bt)step()}draw(ts);requestAnimationFrame(loop)}
/* ===== 画面・ストーリー ===== */
function scene(L,bgm,cb,hue=250){play(bgm);BH=hue;mode='s';let i=0;
 const show=()=>{let l=L[i];if(l[0]=='#')U.innerHTML=`<div class="bn">${l.slice(1)}</div>`;
  else{let [a,b]=l.includes('｜')?l.split('｜'):['',l];U.innerHTML=`<div class="tb">${a?`<b>${a}</b>`:''}<p>${b}</p></div>`}};
 adv=()=>{if(++i>=L.length){adv=null;U.innerHTML='';cb()}else show()};show()}
const WP='<div><button class="wp" onclick="wipe()">セーブデータを消去</button></div>';
function wipe(){if(!confirm('セーブデータをすべて消去します。よろしいですか？'))return;
 try{localStorage.removeItem('save');localStorage.removeItem('ng')}catch(e){}S.ng=0;run={cl:[],min:{}};seen=0;title()}
function title(){play('talk');mode='title';BH=250;U.innerHTML=`<div class="tw"><h1>魔王城</h1><p>十の階層、ふたりの旅路</p><button onclick="start()">${run.cl.length?'つづきから':S.ng?'二周目をはじめる':'はじめる'}</button>${WP}</div>`}
function start(){if(seen||run.cl.length)return nx();seen=1;
 scene(S.ng?['世界は崩壊した。…はずだった。気づけば、ふたりは再び魔王城の門の前に立っていた。','ミナ｜奇妙ね…','ミナ｜皆、ばらばらだわ…','勇者｜今度は、どの階層から挑んでもいい。色々試してみよう。']
 :['勇者と、幼馴染の僧侶ミナは、魔王城の門をくぐった。','ミナ｜この城は全部で10階層。いちばん上に、魔王がいるんだよね。','勇者｜ああ。ふたりなら、きっと大丈夫だ。','ミナ｜…うん。でも、なんだか胸がざわざわするの。行こう、勇者。'],'talk',nx)}
const nx=()=>S.ng?tower():fl(run.cl.length+1);
function tower(){play('talk');mode='m';adv=null;BH=250;let n=run.cl.length,h='';
 for(let f=10;f>=1;f--){let m=NM[f-1],cl=run.cl.includes(f);
  let dis=(f==10&&n<9)?'disabled':(cl&&!S.ng)?'disabled':''; // 2周目はクリア済みでも押せる
  h+=`<button ${dis} onclick="fl(${f})">${f==10?'第10階層　魔王':`第${f}階層　${DE[m-1]}${f==5?'　★中ボス':''}${cl?'　✓':''}`}</button>`}
 U.innerHTML=`<div class="tw"><h2>魔王城</h2><div class="gr">${h}</div>${WP}</div>`}
/* 撃破後のミナのセリフ。二周目以降は撃破順で変わる: ここまで正しい順(eins→neun)ならOKL[撃破数-1]、崩れていたらNGL(固定) */
const OKL=['ミナ｜eins…ひとつめ。胸の奥で、何かがかちりと鳴った気がする。','ミナ｜zwei。ふたつめ。数えるたびに、この城が静かになっていくわ。','ミナ｜drei。みっつ。…ねえ勇者、やっぱりこの順番には意味があるのよ。','ミナ｜vier。よっつ。魔王の気配が、少しずつ近づいてくる…。','ミナ｜fünf。いつつ。半分まで来たわね。…私の中の声も、はっきりしてきた。','ミナ｜sechs。むっつ。…ごめんなさい、ちょっとだけ手が震えてるの。','ミナ｜sieben。ななつ。あと少し。…ふふ、順調ね。','ミナ｜acht。やっつ。もうすぐ全部そろう。…ずっと、待っていたの。','ミナ｜neun。ここのつ。…これで、全部そろったわ。さあ、上へ行きましょう、勇者。'];
const NGL='ミナ｜…何も、起きないわね。この順番じゃ、ないのかもしれない。';
const mina=f=>S.ng?[run.cl.every((q,i)=>NM[q-1]==i+1)?OKL[run.cl.length-1]:NGL]:f==5?['ミナ｜やったね、勇者！あと半分だよ。']:[];
let bt_temp=null;
function askSkip(o){
 if(run.min[o.id]){
  mode='ask';adv=null;
  let st=(o.time||180)-60, min=Math.floor(st/60), sec=st%60;
  U.innerHTML=`<div class="tw"><h2>${o.name}</h2><p style="font-size:2cqw">前回の記録から、残り1分（BGM ${min}:${String(sec).padStart(2,'0')}～）から再開できます。</p>
  <div class="gr"><button onclick="launchBattle(false)">[X] 初めから</button><button onclick="launchBattle(true)">[Z] 残り1分から</button></div></div>`;
  bt_temp=o;
 }else{bt_temp=o;launchBattle(false)}
}
function launchBattle(skip){
 let o=bt_temp;bt_temp=null;if(skip)o.startT=(o.time||180)*60-3600;
 battle(o);
}
function fl(f){if(f==10)return boss();let n=NM[f-1];
 scene([`第${f}階層。`,`${DE[n-1]}が現れた！`+(f==5?'　——この階層の主、中ボスだ。':'')],'talk',()=>
  askSkip({id:f,name:DE[n-1],hue:n*36,pat:rot(n),f:(f==5?1.0:1)*(S.ng?1.3:1),bgm:f==5?'battle':'battle2',time:f==5?180:120,done:()=>{if(!run.cl.includes(f))run.cl.push(f);save();
   scene([`${DE[n-1]}を撃破！（${run.cl.length}/9）`,...mina(f)],'talk',nx)}}),(n*36))}
function boss(){let ok=run.cl.length==9&&run.cl.every((f,i)=>NM[f-1]==i+1);
 if(ok)scene(['最上階。玉座の間。','魔王｜よくぞ来た、勇者よ','勇者｜ここでお前を倒す！','ミナ｜はい、ストップ','勇者｜ミナ…？','ミナ｜ずっとこの時を待っていたのよ、私自身が魔王となって、勇者、貴方を倒す時をね…','魔王｜なんだ…何を言って…','魔王｜ぐっ…','魔王はミナに吸収された。','ミナ｜さぁ、一緒に踊りましょう？'],'story',
  ()=>askSkip({id:11,name:'ミナ',hue:300,pat:TRUE,f:1,bgm:'true',time:180,done:trueEnd,lose:['勇者の体を、無数の光が貫いた。','ミナ｜期待外れね。','#DEAD END']}),300);
 else scene(['最上階。玉座の間。','魔王｜よくぞ来た、勇者よ。','ミナ｜あなたを倒しに来たわ！','勇者｜ここまで来たんだ。行くぞ！'],'talk',
  ()=>askSkip({id:10,name:'魔王',hue:0,pat:MAOU,f:0.9,bgm:'maou',time:180,done:badEnd}),0)}
function badEnd(){S.ng=1;run.cl=[];save();seen=0;
 scene(['魔王｜見事だ、勇者よ…。だが、知らなかったのだな。','魔王｜我は……この世界を支える,楔……。','地鳴りが響き、城が、空が、大地が砕け散っていく。','ミナ｜勇者…！ 手を、離さないで…っ！','#BAD END','魔王を倒すだけでは、世界は救えなかった。もう一度、城へ。二周目からは全階層を自由な順番で攻略できる。'],'end',title,0)}
function trueEnd(){run.cl=[];save();seen=0;
 scene(['ミナ｜……ありがとう。','ミナの体が塵となって消えた。','勇者は、1人寂しく魔王城を離れた…','#TRUE END','— Thank you for playing —'],'story',title,45)}
function die(L,rem,id){seen=1;let r=Math.ceil(rem/60),tm=rem==null?'':`<small>クリアまで あと ${Math.floor(r/60)}:${String(r%60).padStart(2,'0')}</small>`;
 if(rem!=null&&rem<3600&&id){run.min[id]=1;save()} // 残り1分未満到達を記録
 scene((L||['勇者は弾幕に呑まれた。','ミナ｜勇者っ…！！','#DEAD END']).map(l=>l=='#DEAD END'?l+tm:l),'end',title,0)}
/* ===== 入力 ===== */
function dbg2(){bt=null;S.ng=0;seen=1;run={cl:[1,2,3,4,5,6,7,8,9],min:{}};adv=null;U.innerHTML='';boss()}
/* テスト用: Shift+3 で二周目の開始(冒頭の会話→階層選択。撃破済みなし)から */
function dbg3(){bt=null;S.ng=1;seen=0;run={cl:[],min:{}};adv=null;U.innerHTML='';start()}
/* テスト用: Shift+4 で、戦闘中の今の階層(魔王・ミナ含む)を強制クリア */
function dbg4(){if(!bt)return;let d=bt.done;bt=null;d()}
