name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  # "true" のあいだは、公開したページでも Shift+1 のテスト用ショートカットが使える
  # 本番公開の前に "false" に戻すこと
  DEBUG_SHORTCUT: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Check script syntax
        run: |
          node -e "const m=require('fs').readFileSync('index.html','utf8').match(/<script>([\s\S]*)<\/script>/);if(!m)throw new Error('script not found');new Function(m[1]);console.log('syntax ok')"

      - name: Build
        run: |
          mkdir dist
          cp index.html dist/
          if [ -d bgm ]; then cp -r bgm dist/; else echo "::warning::bgm フォルダがありません"; fi
          for n in talk battle maou true story end; do
            ok=0
            for ext in ogg m4a mp3; do
              f=dist/bgm/$n.$ext
              if [ -f "$f" ] && [ "$(stat -c %s "$f")" -gt 1000 ]; then ok=1; fi
            done
            if [ "$ok" = 0 ]; then echo "::warning::bgm/$n の音源(ogg / m4a / mp3)がない、または空です"; fi
          done
          if [ "$DEBUG_SHORTCUT" != "true" ]; then
            if grep -q 'const DEBUG=true;' dist/index.html; then
              sed -i 's/const DEBUG=true;/const DEBUG=false;/' dist/index.html
            else
              echo "::warning::index.html に const DEBUG=true; が見つからないため、テスト用ショートカットは無効化されません"
            fi
          fi
          du -sh dist

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
